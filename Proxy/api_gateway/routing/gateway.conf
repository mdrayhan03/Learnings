# Upstream Pool Definitions
upstream backend_v1 {
    server backend-v1-service:5000;
}

upstream backend_v2 {
    server backend-v2-service:5000;
}

upstream backend_enterprise {
    server backend-enterprise-service:5000;
}

server {
    listen 80;

    location /api/v1/ {
        set $upstream_target "";

        access_by_lua_block {
            local cjson = require "cjson"
            local redis = require "resty.redis"
            local red   = redis:new()
            red:set_timeout(1000)

            local ok, err = red:connect("gateway-cache", 6379)
            if not ok then
                ngx.log(ngx.ERR, "Failed to connect to Redis: ", err)
                ngx.exit(500)
            end

            local api_key = ngx.req.get_headers()["apikey"]
            if not api_key then
                ngx.status = 401
                ngx.say('{"error": "Missing API Key."}')
                ngx.exit(401)
            end

            local raw_user_data, err = red:get("key:" .. api_key)
            if raw_user_data == ngx.null then
                ngx.status = 401
                ngx.say('{"error": "Invalid API Key."}')
                ngx.exit(401)
            end

            local user_data   = cjson.decode(raw_user_data)
            local consumer_id = user_data.user
            local user_tier   = user_data.tier

            local target_upstream = "backend_v1"

            -- 1. Metadata Routing: Dedicated cluster for Enterprise
            if user_tier == "enterprise" then
                target_upstream = "backend_enterprise"

            -- 2. Sticky Canary Routing (20% split) for Standard Users
            else
                -- Consistent Hashing based on Consumer ID
                local hash_value = ngx.crc32_short(consumer_id)
                local bucket = (hash_value % 100) + 1  -- Scale 1-100

                local canary_percentage = 20  -- 20% of users sticky-assigned to v2

                if bucket <= canary_percentage then
                    target_upstream = "backend_v2"
                else
                    target_upstream = "backend_v1"
                end
                
                ngx.req.set_header("X-Canary-Bucket", tostring(bucket))
            end

            ngx.var.upstream_target = target_upstream
            ngx.req.set_header("X-Consumer-ID", consumer_id)
        }

        # Route dynamically based on calculated Lua target
        proxy_pass http://$upstream_target;
    }
}