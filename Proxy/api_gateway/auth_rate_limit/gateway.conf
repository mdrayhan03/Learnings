server {
    listen 80;

    location /api/v1/ {
        # Lua block to execute 7.1 (Auth) and 7.2 (Rate Limiting) before routing
        access_by_lua_block {
            local redis = require "resty.redis"
            local red = redis:new()
            red:set_timeout(1000) -- 1 second timeout

            -- Connect to our Redis container
            local ok, err = red:connect("gateway-cache", 6379)
            if not ok then
                ngx.log(ngx.ERR, "Failed to connect to Redis: ", err)
                ngx.exit(500)
            end

            -- 1. AUTHENTICATION (7.1)
            -- Extract the API Key from the client request header
            local api_key = ngx.req.get_headers()["apikey"]
            if not api_key then
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say('{"error": "Missing API Key. Pass an \'apikey\' header."}')
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end

            -- Look up the API key in Redis to find the Consumer ID
            local consumer_id, err = red:get("key:" .. api_key)
            if consumer_id == ngx.null then
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say('{"error": "Invalid API Key."}')
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end


            -- 2. PER-CONSUMER RATE LIMITING (7.2)
            -- Basic sliding window counter per consumer id
            local limit_key = "rate:" .. consumer_id
            local current_requests, err = red:get(limit_key)

            if current_requests == ngx.null then
                -- First request in this window, set counter to 1 and expire in 10 seconds
                red:set(limit_key, 1)
                red:expire(limit_key, 10)
                current_requests = 1
            else
                current_requests = tonumber(current_requests)
                if current_requests >= 3 then -- Max limit: 3 requests per 10 seconds
                    ngx.status = 429
                    ngx.header["X-RateLimit-Limit"] = "3"
                    ngx.header["X-RateLimit-Remaining"] = "0"
                    ngx.say('{"error": "Rate limit exceeded. Upgrade your subscription tier!"}')
                    ngx.exit(429)
                else
                    red:incr(limit_key)
                end
            end

            -- Inject consumer context forward into the upstream microservice request
            ngx.req.set_header("X-Consumer-ID", consumer_id)
            
            -- Pass rate limit telemetry headers back to user browser
            ngx.header["X-RateLimit-Limit"] = "3"
            ngx.header["X-RateLimit-Remaining"] = tostring(3 - current_requests)
        }

        # If the code above passes successfully, forward traffic down to backend
        proxy_pass http://backend-service:5000;
    }
}