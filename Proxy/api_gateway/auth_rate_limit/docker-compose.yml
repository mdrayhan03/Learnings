version: '3.8'

services:
  gateway:
    image: openresty/openresty:alpine # Using OpenResty (NGINX + Lua) to execute custom auth/rate-limit logic cleanly
    container_name: api_gateway
    ports:
      - "8000:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway-cache
      - backend-service

  gateway-cache:
    image: redis:alpine
    container_name: gateway_cache
    ports:
      - "6379:6379"

  backend-service:
    image: python:3.10-slim
    container_name: backend_service
    working_dir: /app
    command: sh -c "pip install flask && python app.py"
    volumes:
      - ./backend:/app