server {
    listen 80;

    location /api/v1/ {
        # -------------------------------------------------------------
        # 1. INBOUND TRANSFORMATIONS & AUTHENTICATION
        # -------------------------------------------------------------
        access_by_lua_block {
            local cjson = require "cjson"
            local redis = require "resty.redis"
            local red   = redis:new()
            red:set_timeout(1000)

            local ok, err = red:connect("gateway-cache", 6379)
            if not ok then
                ngx.log(ngx.ERR, "Failed to connect to Redis: ", err)
                ngx.exit(500)
            end

            local api_key = ngx.req.get_headers()["apikey"]
            if not api_key then
                ngx.status = 401
                ngx.say('{"error": "Missing API Key."}')
                ngx.exit(401)
            end

            local raw_user_data, err = red:get("key:" .. api_key)
            if raw_user_data == ngx.null then
                ngx.status = 401
                ngx.say('{"error": "Invalid API Key."}')
                ngx.exit(401)
            end

            local user_data   = cjson.decode(raw_user_data)
            local consumer_id = user_data.user

            -- [Inbound 1]: Strip sensitive API key before hitting backend
            ngx.req.clear_header("apikey")

            -- [Inbound 2]: Inject Correlation ID & Consumer Identity
            local correlation_id = ngx.var.http_x_correlation_id or (ngx.req.start_time() .. "-" .. math.random(1000, 9999))
            ngx.req.set_header("X-Correlation-ID", correlation_id)
            ngx.req.set_header("X-Consumer-ID", consumer_id)
        }

        proxy_pass http://backend-service:5000;

        # -------------------------------------------------------------
        # 2. OUTBOUND HEADER TRANSFORMATIONS
        # -------------------------------------------------------------
        header_filter_by_lua_block {
            -- Security Obfuscation: Mask internal server stack
            ngx.header["Server"] = "API-Gateway"
            ngx.header["X-Powered-By"] = nil
        }

        # -------------------------------------------------------------
        # 3. OUTBOUND BODY TRANSFORMATIONS
        # -------------------------------------------------------------
        body_filter_by_lua_block {
            local chunk, eof = ngx.arg[1], ngx.arg[2]
            local ctx = ngx.ctx

            if not ctx.res_buffer then
                ctx.res_buffer = ""
            end

            if chunk ~= "" then
                ctx.res_buffer = ctx.res_buffer .. chunk
                ngx.arg[1] = nil -- Hold output stream until buffer completes
            end

            if eof then
                local cjson = require "cjson"
                local status, data = pcall(cjson.decode, ctx.res_buffer)

                if status and type(data) == "table" then
                    -- Mask/Remove sensitive internal backend fields
                    data["internal_db_host"] = nil
                    data["debug_trace"]      = nil

                    -- Standardize into unified response envelope
                    local envelope = {
                        status = "success",
                        gateway_timestamp = ngx.now(),
                        data = data
                    }
                    ngx.arg[1] = cjson.encode(envelope)
                else
                    ngx.arg[1] = ctx.res_buffer
                end
            end
        }
    }
}