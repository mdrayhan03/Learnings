version: '3.8'

services:
  gateway:
    image: openresty/openresty:alpine
    container_name: api_gateway_7_3
    ports:
      - "8000:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway-cache
      - backend-service

  gateway-cache:
    image: redis:alpine
    container_name: gateway_cache_7_3
    ports:
      - "6379:6379"

  backend-service:
    image: python:3.10-slim
    container_name: backend_service_7_3
    working_dir: /app
    command: sh -c "pip install flask && python app.py"
    volumes:
      - ./backend:/app