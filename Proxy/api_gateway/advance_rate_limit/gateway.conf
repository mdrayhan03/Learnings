server {
    listen 80;

    location /api/v1/ {
        access_by_lua_block {
            local cjson = require "cjson"
            local redis = require "resty.redis"
            local red = redis:new()
            red:set_timeout(1000)

            local ok, err = red:connect("gateway-cache", 6379)
            if not ok then
                ngx.log(ngx.ERR, "Failed to connect to Redis: ", err)
                ngx.exit(500)
            end

            -- 1. AUTHENTICATE & FETCH USER CONFIG
            local api_key = ngx.req.get_headers()["apikey"]
            if not api_key then
                ngx.status = 401
                ngx.say('{"error": "Missing API Key."}')
                ngx.exit(401)
            end

            local raw_user_data, err = red:get("key:" .. api_key)
            if raw_user_data == ngx.null then
                ngx.status = 401
                ngx.say('{"error": "Invalid API Key."}')
                ngx.exit(401)
            end

            local user_data = cjson.decode(raw_user_data)
            local consumer_id = user_data.user
            local user_tier   = user_data.tier

            -- 2. DYNAMIC TIER PARAMETERS (Capacity & Refill Rate)
            local capacity = 3       -- Default Burst Capacity
            local refill_rate = 0.3  -- Refill 1 token every ~3 seconds

            if user_tier == "pro" then
                capacity = 10        -- Pro Burst Capacity (Can burst up to 10 instantly)
                refill_rate = 1.0    -- Refill 1 token per second continuously
            end

            -- 3. EMBEDDED LUA TOKEN BUCKET SCRIPT
            local script = [[
                local key = KEYS[1]
                local capacity = tonumber(ARGV[1])
                local refill_rate = tonumber(ARGV[2])
                local now = tonumber(ARGV[3])
                local requested = tonumber(ARGV[4])

                local data = redis.call("HMGET", key, "tokens", "last_updated")
                local tokens = tonumber(data[1])
                local last_updated = tonumber(data[2])

                if not tokens or not last_updated then
                    tokens = capacity
                    last_updated = now
                else
                    local elapsed = now - last_updated
                    if elapsed > 0 then
                        local generated_tokens = elapsed * refill_rate
                        tokens = math.min(capacity, tokens + generated_tokens)
                        last_updated = now
                    end
                end

                local allowed = false
                if tokens >= requested then
                    tokens = tokens - requested
                    allowed = true
                end

                redis.call("HMSET", key, "tokens", tokens, "last_updated", last_updated)
                redis.call("EXPIRE", key, 3600)

                local retry_after = 0
                if not allowed then
                    local missing_tokens = requested - tokens
                    retry_after = math.ceil(missing_tokens / refill_rate)
                end

                return { allowed and 1 or 0, math.floor(tokens), retry_after }
            ]]

            -- Execute atomic script inside Redis
            local now = ngx.now() -- High-precision time in seconds (e.g. 1711234567.123)
            local res, err = red:eval(script, 1, "rate:tb:" .. consumer_id, capacity, refill_rate, now, 1)

            if not res then
                ngx.log(ngx.ERR, "Failed to execute Token Bucket Lua script: ", err)
                ngx.exit(500)
            end

            local allowed          = res[1] == 1
            local remaining_tokens = res[2]
            local retry_after      = res[3]

            -- 4. TELEMETRY & ENFORCEMENT
            ngx.header["X-RateLimit-Limit"]     = tostring(capacity)
            ngx.header["X-RateLimit-Remaining"] = tostring(remaining_tokens)

            if not allowed then
                ngx.status = 429
                ngx.header["Retry-After"] = tostring(retry_after)
                ngx.say('{"error": "Rate limit exceeded. Bucket empty!", "retry_after_seconds": ' .. retry_after .. '}')
                ngx.exit(429)
            end

            -- Pass forward request to backend microservice
            ngx.req.set_header("X-Consumer-ID", consumer_id)
        }

        proxy_pass http://backend-service:5000;
    }
}